extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Public browser traffic cannot reach the backend's general OTLP receivers.
  otlp/browser:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        max_request_body_size: 262144
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 64
  batch: {}
  resource/browser:
    attributes:
      - {key: service.name, value: frontend-web, action: upsert}
      - {key: service.namespace, value: browser, action: upsert}
      - {key: rollout.pod_template_hash, action: delete}
      - {key: service.version, action: delete}
  attributes/browser:
    # Browser-supplied labels must not masquerade as rollout/backend identity.
    actions:
      - {key: service.name, action: delete}
      - {key: service.namespace, action: delete}
      - {key: rollout.pod_template_hash, action: delete}
      - {key: service.version, action: delete}
connectors:
  span_metrics:
    namespace: otel_demo.span.metrics
    histogram:
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    # Span names can contain arbitrary paths/IDs. Keep collector.instance.id.
    exclude_dimensions: [span.name]
    # One value per ReplicaSet/image, not per pod or request. The Prometheus
    # exporter's underscore translation retains these on both calls and buckets.
    dimensions:
      - name: rollout.pod_template_hash
      - name: service.version
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 15s
    metrics_expiration: 15m
    series_expiration: 15m
    resource_metrics_key_attributes: [service.name]
    aggregation_cardinality_limit: 1000
exporters:
  debug:
    verbosity: basic
  otlphttp/loki:
    # Native Loki OTLP ingestion; the exporter appends /v1/logs.
    endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    translation_strategy: UnderscoreEscapingWithSuffixes
    # This Collector receives the demo's telemetry. Native OTLP metrics are
    # exported without the span-metrics namespace and receive this project label.
    const_labels:
      project: otel-demo
    resource_to_telemetry_conversion:
      enabled: false
service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                # Keep the Collector's documented otelcol_* metric names.
                without_type_suffix: true
                without_units: true
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, span_metrics]
    traces/browser:
      receivers: [otlp/browser]
      processors: [memory_limiter, resource/browser, attributes/browser, batch]
      exporters: [debug, span_metrics]
    metrics:
      receivers: [otlp, span_metrics]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
