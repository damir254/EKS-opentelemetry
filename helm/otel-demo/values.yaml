# Shared chart defaults. Load the service and environment layers explicitly.
# See ../../README.md; Helm does not automatically load other values files.

defaultEnv:
  OTEL_SERVICE_NAME:
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: "metadata.labels['app.kubernetes.io/component']"
  OTEL_COLLECTOR_NAME:
    value: "otel-collector"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:
    value: "cumulative"
  OTEL_RESOURCE_ATTRIBUTES:
    value: "service.version=1.0.0"

# The service catalog is disabled until its services/<name>.yaml is loaded.
services:
  accounting:
    enabled: false
  ad:
    enabled: false
  cart:
    enabled: false
  checkout:
    enabled: false
  currency:
    enabled: false
  email:
    enabled: false
  fraud-detection:
    enabled: false
  frontend:
    enabled: false
  frontend-proxy:
    enabled: false
  image-provider:
    enabled: false
  load-generator:
    enabled: false
  payment:
    enabled: false
  product-catalog:
    enabled: false
  quote:
    enabled: false
  recommendation:
    enabled: false
  shipping:
    enabled: false

# Shared dependencies and connectivity are opt-in through values/*.yaml.
networkPolicy:
  enabled: false
  connections: {}
  albSourceCidr: ""
postgres:
  enabled: false
flagd:
  enabled: false
valkey:
  enabled: false
kafka:
  enabled: false
otelCollector:
  enabled: false
paymentAnalysis:
  prometheusAddress: ""
ingress:
  enabled: false
  loadGenerator:
    enabled: false
