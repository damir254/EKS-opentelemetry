      portName: grpc
      protocol: TCP
    containerPort: 8080
    selectorLabels:
      includeCommon: true
    env:
      PRODUCT_CATALOG_PORT:
        value: "8080"
      FLAGD_HOST:
        value: "flagd"
      FLAGD_PORT:
        value: "8013"
      GOMEMLIMIT:
        value: "16MiB"
      DB_CONNECTION_STRING:
        valueFrom:
          secretKeyRef:
            name: product-catalog-db
            key: connection-string
      OTEL_SEMCONV_STABILITY_OPT_IN:
        value: "database"
      OTEL_EXPORTER_OTLP_ENDPOINT:
        value: "http://$(OTEL_COLLECTOR_NAME):4317"
      OTEL_CONFIG_FILE:
        value: "/otel-config.yml"
      OTEL_RESOURCE_ATTRIBUTES_EXTRA:
        value: "service.criticality=high"
    mountedConfigMaps:
    - name: product-catalog-otel-config
      mountPath: /otel-config.yml
      subPath: otel-config.yml
      data:
        otel-config.yml: |
          file_format: "1.0"
          disabled: false
          logger_provider:
            processors:
              - batch:
                  exporter:
                    otlp_grpc:
                      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
          meter_provider:
            readers:
              - periodic:
                  exporter:
                    otlp_grpc:
                      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
                      temporality_preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
          tracer_provider:
            processors:
              - batch:
                  exporter:
                    otlp_grpc:
                      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
          propagator:
            composite:
              - tracecontext:
              - baggage:
          resource:
            attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
    resources:
      limits:
        memory: 100Mi
    securityContext:
      readOnlyRootFilesystem: true
    mountedEmptyDirs:
    - name: tmp
      mountPath: /tmp
  payment:
    enabled: true
    replicaCount: 2
    istio:
      enabled: true
    rollout:
      enabled: true
      strategy:
        canary:
          maxSurge: 1
          maxUnavailable: 0
          # Keep stable at full capacity for immediate traffic restoration.
          dynamicStableScale: false
          scaleDownDelaySeconds: 30
          abortScaleDownDelaySeconds: 30
          trafficRouting:
            istio:
              virtualService:
                name: payment
                routes: [primary]
              destinationRule:
                name: payment
                stableSubsetName: stable
                canarySubsetName: canary
          steps:
          - setWeight: 10
          - pause: {duration: 60s}
          - analysis: &paymentAnalysis
              analysisRunMetadata:
                labels:
                  app.kubernetes.io/component: payment
              templates:
              - templateName: payment-red
              args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
          - setWeight: 25
          - pause: {duration: 60s}
          - analysis: *paymentAnalysis
          - setWeight: 50
          - pause: {duration: 60s}
          - analysis: *paymentAnalysis
          - setWeight: 100
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 60
    topologySpread:
      enabled: true
      zone: true
      hostname: true
    image:
      repository: 060941289716.dkr.ecr.eu-central-1.amazonaws.com/payment
      tag: "2fb4bed51e5212d38cff78c6f2cd6842b2d76a73"
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: payment
      automount: false
    service:
      type: ClusterIP
      port: 8080
      targetPort: grpc
      portName: grpc
      protocol: TCP
    containerPort: 8080
    selectorLabels:
      includeCommon: true
    env:
      PAYMENT_PORT:
        value: "8080"
      FLAGD_HOST:
        value: flagd
      FLAGD_PORT:
        value: "8013"
      OTEL_EXPORTER_OTLP_ENDPOINT:
        value: "http://otel-collector:4317"
      IPV6_ENABLED:
        value: "false"
      OTEL_RESOURCE_ATTRIBUTES_EXTRA:
        value: service.criticality=critical
      NODE_OPTIONS:
        value: --require @opentelemetry/auto-instrumentations-node/register
      OTEL_EXPORTER_OTLP_PROTOCOL:
        value: grpc
    resources:
