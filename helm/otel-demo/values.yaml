# Configure the ECR account using scripts/configure-aws.py. Build the three
# custom images in ECR and set their initial full SHA tags before the first sync.
networkPolicy:
  enabled: true
  # Verified against module.vpc.cidr_block in terraform/main.tf. ALB IP targets
  # reach frontend-proxy from VPC addresses; this is ingress on TCP 8080 only.
  albSourceCidr: 10.0.0.0/16
  # Directed TCP connections: source component -> destination component -> ports.
  # Each edge renders BOTH source egress and destination ingress. Keep this map
  # aligned with env, container ports and dependency templates below.
  # Upstream image config inspected at 604c4612c4339e5bd4fe11efa33d254f29ddfd44
  # (the k6 implementation configured here; latest-* image tags are mutable).
  connections:
    accounting:
      kafka: [9092]
      postgres: [5432]
      otel-collector: [4318]
    ad:
      flagd: [8013]
      otel-collector: [4318]
    cart:
      valkey: [6379] # valkey-cart Service, including the wait init container
      flagd: [8013]
      otel-collector: [4317]
    checkout:
      cart: [8080]
      currency: [8080]
      email: [8080]
      payment: [8080]
      product-catalog: [8080]
      shipping: [8080]
      kafka: [9092] # also used by the wait init container
      flagd: [8013]
      otel-collector: [4318]
    currency:
      otel-collector: [4317]
    email:
      flagd: [8013]
      otel-collector: [4318]
    flagd:
      otel-collector: [4318]
    fraud-detection:
      kafka: [9092]
      flagd: [8013]
      otel-collector: [4318]
    frontend:
      ad: [8080]
      cart: [8080]
      checkout: [8080]
      currency: [8080]
      product-catalog: [8080]
      recommendation: [8080]
      shipping: [8080]
      otel-collector: [4317]
      # Feature flags execute in the browser via frontend-proxy /flagservice/.
    frontend-proxy:
      frontend: [8080]
      image-provider: [8081]
      flagd: [8013]
      otel-collector: [4317, 4318] # proxy telemetry + browser /otlp-http/ route
      # Legacy Locust/UI env vars have no deployed backend/listener here.
    image-provider:
      otel-collector: [4317]
    kafka: {} # one broker/controller; KRaft quorum uses localhost:9093
    load-generator:
      frontend-proxy: [8080]
      flagd: [8016] # k6 entrypoint/script use OFREP, not FLAGD_PORT's RPC port
      otel-collector: [4318]
    otel-collector: {} # debug output and locally scraped metrics only
    payment:
      flagd: [8013]
      otel-collector: [4317]
    postgres: {} # astronomy-db Service; no outbound database dependency
    product-catalog:
      postgres: [5432]
      flagd: [8013]
      otel-collector: [4317]
    quote:
      otel-collector: [4318]
    recommendation:
      product-catalog: [8080]
      flagd: [8013]
      otel-collector: [4317]
    shipping:
      quote: [8080]
      flagd: [8013]
      otel-collector: [4318]
    valkey: {}
defaultEnv:
  OTEL_SERVICE_NAME:
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: "metadata.labels['app.kubernetes.io/component']"
  OTEL_COLLECTOR_NAME:
    value: "otel-collector"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:
    value: "cumulative"
  OTEL_RESOURCE_ATTRIBUTES:
    value: "service.version=1.0.0"
services:
  # Optional per-service topologySpread: {enabled: true, zone: true, hostname: true}.
  # Omitted flags default to false. Enable for replicated stateless services.
  # Selectors come from pod labels and apply at any replica count, including HPA scaling.
  recommendation:
    enabled: true
    replicaCount: 1
    image:
      repository: 060941289716.dkr.ecr.eu-central-1.amazonaws.com/recommendation
      tag: "e63cbdbf0e2ac9a64960900d63711fc85cee8584"
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: recommendation
      automount: false
    service:
      type: ClusterIP
      port: 8080
      targetPort: grpc
      portName: grpc
      protocol: TCP
    containerPort: 8080
    selectorLabels:
      includeCommon: true
    podSecurityContext:
      runAsNonRoot: false
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    env:
      OTEL_SERVICE_NAME:
        value: recommendation
      RECOMMENDATION_PORT:
        value: "8080"
      PRODUCT_CATALOG_ADDR:
        value: "product-catalog:8080"
      FLAGD_HOST:
        value: flagd
      FLAGD_PORT:
        value: "8013"
      OTEL_EXPORTER_OTLP_ENDPOINT:
        value: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:
        value: delta
      OTEL_RESOURCE_ATTRIBUTES:
        value: "service.namespace=otel-demo"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  product-catalog:
    enabled: true
    replicaCount: 1
    image:
      repository: 060941289716.dkr.ecr.eu-central-1.amazonaws.com/product-catalog
      tag: "e686e5efcf40db177b775573921974a4d3f74402"
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: product-catalog
      automount: false
    service:
