# Service-owned workload configuration. Environment overrides load after this file.
services:
  load-generator:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/open-telemetry/demo
      # Pin the inspected Locust image; its runtime differs from the k6 config.
      tag: latest-load-generator@sha256:630de58f7621dc104476800d36824917d3016c09aed694da33512d3dc7090b57
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: load-generator
      automount: false
    service:
      type: ClusterIP
      port: 8089
      targetPort: http
      portName: http
      protocol: TCP
    containerPort: 8089
    selectorLabels:
      includeCommon: true
    # Locust serves its local web UI even before the target application is ready.
    readinessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      LOCUST_HOST:
        value: "http://frontend-proxy:8080"
      # Keep bootstrap traffic modest; increase users after verifying capacity.
      LOCUST_USERS:
        value: "10"
      LOCUST_SPAWN_RATE:
        value: "1"
      LOCUST_AUTOSTART:
        value: "true"
      LOCUST_WEB_HOST:
        value: "0.0.0.0"
      LOCUST_WEB_PORT:
        value: "8089"
      LOCUST_BROWSER_TRAFFIC_ENABLED:
        value: "false"
      FLAGD_HOST:
        value: "flagd"
      FLAGD_PORT:
        value: "8013"
      FLAGD_OFREP_PORT:
        value: "8016"
      OTEL_EXPORTER_OTLP_ENDPOINT:
        value: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL:
        value: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES_EXTRA:
        value: "service.criticality=low"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 512Mi
    securityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true
