# Service-owned workload configuration. Environment overrides load after this file.
services:
  frontend-proxy:
    enabled: true
    replicaCount: 2
    # Anonymous browser traces: limits apply independently to each proxy pod.
    browserTelemetry:
      maxRequestBytes: 262144 # 256 KiB; also capped by the browser Collector receiver.
      requestsPerSecond: 10
      burst: 20
    topologySpread:
      enabled: true
      zone: true
      hostname: true
    pdb:
      enabled: true
      maxUnavailable: 1
    image:
      # Official patched Envoy; the demo routing config is supplied by Helm.
      repository: envoyproxy/envoy
      tag: "v1.39.2@sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85"
      pullPolicy: IfNotPresent
    mountedConfigMaps:
      - name: frontend-proxy-config
        mountPath: /etc/envoy
        templateData: true
        dataFiles:
          envoy.yaml: files/frontend-proxy/envoy.yaml.tpl
    serviceAccount:
      create: true
      name: frontend-proxy
      automount: false
    service:
      type: ClusterIP
      port: 8080
      targetPort: http
      portName: http
      protocol: TCP
    containerPort: 8080
    selectorLabels:
      includeCommon: true
    # Envoy admin /ready reports local server readiness without calling upstream services.
    readinessProbe:
      httpGet:
        path: /ready
        port: 10000
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      ENVOY_PORT:
        value: "8080"
      ENVOY_ADDR:
        value: "0.0.0.0"
      ENVOY_ADMIN_PORT:
        value: "10000"
      FLAGD_HOST:
        value: flagd
      FLAGD_PORT:
        value: "8013"
      FLAGD_UI_HOST:
        value: flagd
      FLAGD_UI_PORT:
        value: "4000"
      FRONTEND_HOST:
        value: "frontend"
      FRONTEND_PORT:
        value: "8080"
      GRAFANA_HOST:
        value: grafana
      GRAFANA_PORT:
        value: "80"
      IMAGE_PROVIDER_HOST:
        value: image-provider
      IMAGE_PROVIDER_PORT:
        value: "8081"
      JAEGER_HOST:
        value: jaeger
      JAEGER_UI_PORT:
        value: "16686"
      CHATBOT_HOST:
        value: chatbot
      CHATBOT_PORT:
        value: "7860"
      OPAMP_SERVER_HOST:
        value: opamp-server
      OPAMP_SERVER_UI_PORT:
        value: "4321"
      FIREPIT_HOST:
        value: firepit
      FIREPIT_PORT:
        value: "8080"
      TELEMETRY_DOCS_HOST:
        value: telemetry-docs
      TELEMETRY_DOCS_PORT:
        value: "8000"
      OTEL_COLLECTOR_HOST:
        value: $(OTEL_COLLECTOR_NAME)
      OTEL_COLLECTOR_PORT_GRPC:
        value: "4317"
      OTEL_COLLECTOR_PORT_BROWSER_HTTP:
        value: "4319"
      OTEL_RESOURCE_ATTRIBUTES_EXTRA:
        value: service.criticality=critical
    resources:
      requests:
        cpu: 50m
        memory: 90Mi
      limits:
        memory: 90Mi
    securityContext:
      runAsUser: 101
      runAsGroup: 101
      runAsNonRoot: true
