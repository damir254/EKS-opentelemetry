# Service-owned workload configuration. Environment overrides load after this file.
services:
  fraud-detection:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/open-telemetry/demo
      tag: "latest-fraud-detection@sha256:ffa4caad822bcaf8e865b1e3938cc8c678afc66cec01edc7460f5c63ad44d9ba"
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: fraud-detection
      automount: false
    # Kafka consumer with no inbound listener; preserve the existing placeholder.
    service:
      type: ClusterIP
      port: 8080
      targetPort: tcp-unused
      portName: tcp-unused
      protocol: TCP
    containerPort: 8080
    selectorLabels:
      includeCommon: true
    env:
      KAFKA_ADDR:
        value: kafka:9092
      KAFKA_TOPIC:
        value: orders
      FLAGD_HOST:
        value: flagd
      FLAGD_PORT:
        value: "8013"
      OTEL_EXPORTER_OTLP_ENDPOINT:
        value: http://$(OTEL_COLLECTOR_NAME):4318
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES:
        value: "true"
      OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED:
        value: "true"
      OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION:
        value: latest
      OTEL_RESOURCE_ATTRIBUTES_EXTRA:
        value: service.criticality=low
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 400Mi
    initContainers:
    - name: wait-for-kafka
      image: busybox:latest@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
      command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
