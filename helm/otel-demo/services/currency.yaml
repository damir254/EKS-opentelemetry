# Service-owned workload configuration. Environment overrides load after this file.
services:
  currency:
    enabled: true
    replicaCount: 2
    topologySpread:
      enabled: true
      zone: true
      hostname: true
    pdb:
      enabled: true
      maxUnavailable: 1
    image:
      repository: ghcr.io/open-telemetry/demo
      tag: "latest-currency@sha256:12e4b5e9d129eb49e0d8cb044f670643a5692a2d40b98d9e928c7c225ad22056"
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
      name: currency
      automount: false
    service:
      type: ClusterIP
      port: 8080
      targetPort: grpc
      portName: grpc
      protocol: TCP
    containerPort: 8080
    selectorLabels:
      includeCommon: true
    readinessProbe:
      grpc:
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      CURRENCY_PORT:
        value: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT:
        value: "http://otel-collector:4317"
      VERSION:
        value: "1.16.0"
      IPV6_ENABLED:
        value: "false"
      OTEL_RESOURCE_ATTRIBUTES_EXTRA:
        value: service.criticality=high
    resources:
      requests:
        cpu: 25m
        memory: 20Mi
      limits:
        memory: 20Mi
    securityContext: {}
