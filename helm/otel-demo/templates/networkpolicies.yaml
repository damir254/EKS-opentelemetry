{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $common := include "otel-demo.selectorLabels" . | fromYaml }}
{{- $workloads := dict }}
{{- $meshed := list }}
{{- range $name, $service := .Values.services }}
{{- $_ := set $workloads $name $service.enabled }}
{{- if and $service.enabled ($service.istio | default dict).enabled }}
{{- $meshed = append $meshed $name }}
{{- end }}
{{- end }}
{{- range $component, $key := dict "flagd" "flagd" "kafka" "kafka" "postgres" "postgres" "valkey" "valkey" "otel-collector" "otelCollector" }}
{{- $_ := set $workloads $component (index $root.Values $key).enabled }}
{{- end }}

{{/* Build the two halves of every enabled TCP edge from one dependency map. */}}
{{- $ingress := dict }}
{{- $egress := dict }}
{{- range $source, $destinations := .Values.networkPolicy.connections }}
{{- if not (hasKey $workloads $source) }}
{{- fail (printf "networkPolicy.connections: unknown source component %s" $source) }}
{{- end }}
{{- range $destination, $numbers := $destinations }}
{{- if not (hasKey $workloads $destination) }}
{{- fail (printf "networkPolicy.connections: unknown destination component %s" $destination) }}
{{- end }}
{{- if not $numbers }}
{{- fail (printf "networkPolicy.connections: %s -> %s requires explicit ports" $source $destination) }}
{{- end }}
{{- if and (index $workloads $source) (index $workloads $destination) }}
{{- $ports := list }}
{{- range $numbers }}
{{- $ports = append $ports (dict "protocol" "TCP" "port" (int .)) }}
{{- end }}
{{- $sourcePeer := dict "podSelector" (dict "matchLabels" (merge (dict "app.kubernetes.io/component" $source) $common)) }}
{{- $destinationPeer := dict "podSelector" (dict "matchLabels" (merge (dict "app.kubernetes.io/component" $destination) $common)) }}
{{- $_ := set $ingress $destination (append (get $ingress $destination | default list) (dict "from" (list $sourcePeer) "ports" $ports)) }}
{{- $_ := set $egress $source (append (get $egress $source | default list) (dict "to" (list $destinationPeer) "ports" $ports)) }}
{{- end }}
{{- end }}
{{- end }}

{{- range $direction := list "Ingress" "Egress" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $root.Release.Name }}-default-deny-{{ lower $direction }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" $root | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [{{ $direction }}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-demo.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

{{- range $component, $enabled := $workloads }}
{{- if $enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $root.Release.Name }}-{{ $component }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-demo.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- get $ingress $component | default list | toYaml | nindent 4 }}
  egress:
    {{- get $egress $component | default list | toYaml | nindent 4 }}
{{- end }}
{{- end }}

{{- if and .Values.ingress.enabled (index .Values.services "frontend-proxy").enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-alb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ required "networkPolicy.albSourceCidr is required for ALB IP targets" .Values.networkPolicy.albSourceCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ (index .Values.services "frontend-proxy").containerPort }}
{{- end }}

{{- if .Values.otelCollector.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8889
{{- end }}

{{- if $meshed }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-istiod
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-demo.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: {{ $meshed | toJson }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
              istio: pilot
      ports:
        # Istio 1.31 default TLS xDS and certificate service. No webhook,
        # plaintext xDS, proxy admin, or Pod Identity/IMDS exception is needed.
        - protocol: TCP
          port: 15012
{{- end }}
{{- end }}
