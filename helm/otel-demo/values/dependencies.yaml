# Single-instance demo data survives pod replacement; deleting its StatefulSet deletes storage.
postgres:
  enabled: true
  persistence:
    storageClassName: gp3
    size: 5Gi
  image:
    repository: postgres
    tag: "16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65"
    pullPolicy: IfNotPresent
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  readinessProbe:
    exec:
      command:
      - pg_isready
      - -h
      - 127.0.0.1
      - -p
      - '5432'
      - -U
      - postgres
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
flagd:
  enabled: true
  image:
    repository: ghcr.io/open-feature/flagd
    tag: "v0.16.0@sha256:32234e63c1d0634883aabd31cbd46802934aaaef0153dfd653b5d1017940bb4e"
    pullPolicy: IfNotPresent
  service:
    name: flagd
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 96Mi
  readinessProbe:
    tcpSocket:
      port: grpc
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
valkey:
  enabled: true
  persistence:
    storageClassName: gp3
    size: 1Gi
  image:
    repository: ghcr.io/valkey-io/valkey
    tag: "9.0.4-alpine3.23@sha256:107b203169a20ef7c87548c157f4e4a833dbbbd20fefd3a26740b7f98ac80216"
    pullPolicy: IfNotPresent
  service:
    name: valkey-cart
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  readinessProbe:
    exec:
      command:
      - valkey-cli
      - ping
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
kafka:
  enabled: true
  persistence:
    storageClassName: gp3
    size: 10Gi
  image:
    repository: apache/kafka
    tag: "4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"
    pullPolicy: IfNotPresent
  service:
    name: kafka
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      # Observed working set is ~380Mi; reserve it when Auto Mode packs nodes.
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    tcpSocket:
      port: tcp-kafka
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
otelCollector:
  enabled: true
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: "0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6"
    pullPolicy: IfNotPresent
  service:
    name: otel-collector
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  readinessProbe:
    httpGet:
      path: /
      port: http-health
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
