# Shared demo dependencies; lifecycle and production hardening are separate work.
postgres:
  enabled: true
  podAnnotations:
    # Protect ephemeral data from voluntary consolidation; node rotation still
    # requires durable storage for production.
    karpenter.sh/do-not-disrupt: "true"
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  readinessProbe:
    exec:
      command:
      - pg_isready
      - -h
      - 127.0.0.1
      - -p
      - '5432'
      - -U
      - postgres
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
flagd:
  enabled: true
  image:
    repository: ghcr.io/open-feature/flagd
    tag: v0.16.0
    pullPolicy: IfNotPresent
  service:
    name: flagd
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 96Mi
  readinessProbe:
    tcpSocket:
      port: grpc
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
valkey:
  enabled: true
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  image:
    repository: ghcr.io/valkey-io/valkey
    tag: 9.0.4-alpine3.23
    pullPolicy: IfNotPresent
  service:
    name: valkey-cart
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  readinessProbe:
    exec:
      command:
      - valkey-cli
      - ping
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
kafka:
  enabled: true
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  image:
    repository: apache/kafka
    tag: 4.3.1
    pullPolicy: IfNotPresent
  service:
    name: kafka
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      # Observed working set is ~380Mi; reserve it when Auto Mode packs nodes.
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    tcpSocket:
      port: tcp-kafka
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
otelCollector:
  enabled: true
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.157.0
    pullPolicy: IfNotPresent
  service:
    name: otel-collector
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  readinessProbe:
    httpGet:
      path: /
      port: http-health
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
