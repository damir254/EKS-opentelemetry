# Development environment infrastructure overrides.
networkPolicy:
  # Matches module.vpc.cidr_block in terraform/main.tf; ALB IP targets use VPC IPs.
  albSourceCidr: 10.0.0.0/16
paymentAnalysis:
  # monitoring release + kube-prometheus-stack fullname (truncated to 26 chars).
  prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
ingress:
  enabled: true
  name: otel-demo
  className: alb
  host: demo.damircloud.com
  loadGenerator:
    enabled: true
    host: loadgen.damircloud.com
    # ALB listener condition applies only to the Locust backend.
    allowedCIDRs:
      - 109.175.0.0/16
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:060941289716:certificate/d1eb9fc5-765e-4f9c-9417-458866bd4763
    external-dns.kubernetes.io/alias: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
