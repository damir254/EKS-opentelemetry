name: Reusable Build, Scan and ECR Publish

on:
  workflow_call:
    inputs:
      service-name:
        description: Service name and isolated BuildKit cache scope
        required: true
        type: string
      build-context:
        description: Build context relative to the repository root
        required: true
        type: string
      dockerfile:
        description: Dockerfile relative to the repository root
        required: true
        type: string
      ecr-repository:
        description: Destination ECR repository name
        required: true
        type: string

# The publish job inherits permissions from the caller: only the main caller
# grants contents: read + id-token: write. Declaring id-token here would also
# require PR callers to grant it, even when publication is skipped.
jobs:
  validate-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build final application image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ inputs.service-name }}:ci-${{ github.sha }}
          # The Docker load exporter cannot retain attestations.
          sbom: false
          provenance: false
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}

      - name: Gate final image on fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ inputs.service-name }}:ci-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 10m
        env:
          # Scan the loaded image only; never fall back to a registry lookup.
          TRIVY_IMAGE_SRC: docker
          # No repository ignore file may silently suppress individual CVEs.
          TRIVY_IGNOREFILE: /dev/null
          # Print finding tables without the full per-package inventory.
          TRIVY_TABLE_MODE: detailed

  publish:
    needs: validate-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Fresh runner; permissions inherited ONLY from the main caller above.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push SHA image with SBOM and provenance
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify the published digest with GitHub OIDC
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
          # Fulcio uses job_workflow_ref (the reusable signer) as the SAN.
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/reusable-build-push.yaml@refs/heads/main
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            "${IMAGE}@${DIGEST}"
