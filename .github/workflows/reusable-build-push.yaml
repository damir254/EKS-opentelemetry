name: Reusable Build, Scan and ECR Publish

on:
  workflow_call:
    inputs:
      service-name:
        description: Service name and isolated BuildKit cache scope
        required: true
        type: string
      build-context:
        description: Build context relative to the repository root
        required: true
        type: string
      dockerfile:
        description: Dockerfile relative to the repository root
        required: true
        type: string
      ecr-repository:
        description: Destination ECR repository name
        required: true
        type: string

# Permissions are inherited from the caller. PR callers grant contents: read;
# only the main-branch caller grants id-token: write. AWS/signing steps below
# run after scanning and only for a push to main.
jobs:
  validate-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build one OCI archive with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ inputs.service-name }}:ci-${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}

      - name: Unpack the OCI archive for Trivy's layout scanner
        run: |
          mkdir "$RUNNER_TEMP/image"
          tar -xf "$RUNNER_TEMP/image.tar" -C "$RUNNER_TEMP/image"

      - name: Gate final image on fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          input: ${{ runner.temp }}/image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 10m
        env:
          TRIVY_PLATFORM: linux/amd64
          # No repository ignore file may silently suppress individual CVEs.
          TRIVY_IGNOREFILE: /dev/null
          # Print finding tables without the full per-package inventory.
          TRIVY_TABLE_MODE: detailed

      - name: Authenticate to AWS with GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Publish scanned archive, verify signature, then expose release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}
          OCI_ARCHIVE: ${{ runner.temp }}/image.tar
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          SKOPEO_IMAGE: quay.io/skopeo/stable:v1.21.0@sha256:a585e4a3b8a045baa87c7f1b2f940d6d299ebede85ab3f2419d52d2264eefc93
          # Fulcio uses job_workflow_ref (the reusable signer) as the SAN.
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/reusable-build-push.yaml@refs/heads/main
        run: bash .github/scripts/publish-image.sh
