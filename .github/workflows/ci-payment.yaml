name: Payment CI

on:
  pull_request:
    paths:
      - "src/payment/**"
      - ".dockerignore"
      - "pb/demo.proto"
      - ".github/workflows/ci-payment.yaml"
      - ".github/workflows/reusable-build-push.yaml"

  push:
    branches: [main]
    paths:
      - "src/payment/**"
      - ".dockerignore"
      - "pb/demo.proto"
      - ".github/workflows/ci-payment.yaml"
      - ".github/workflows/reusable-build-push.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/payment
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/payment/.node-version
          cache: npm
          cache-dependency-path: src/payment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Separate callers keep id-token unavailable to every PR job, including
  # jobs inside the reusable workflow. Only the main caller delegates OIDC.
  pull-request-image:
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build-push.yaml
    with:
      service-name: payment
      build-context: .
      dockerfile: src/payment/Dockerfile
      ecr-repository: payment

  main-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-build-push.yaml
    with:
      service-name: payment
      build-context: .
      dockerfile: src/payment/Dockerfile
      ecr-repository: payment
