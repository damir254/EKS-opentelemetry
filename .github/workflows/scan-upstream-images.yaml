name: Upstream and platform image scans

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-image-scans
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      images: ${{ steps.inventory.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Render images from the configured Argo CD charts
        id: inventory
        run: |
          python .github/scripts/validate-kubernetes.py --image-inventory "$RUNNER_TEMP/images.json"
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("images=" + (Path(os.environ["RUNNER_TEMP"]) / "images.json").read_text())
          PY

  scan:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the configured public image, including unfixed findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: json
          output: ${{ runner.temp }}/scan.json
          timeout: 10m
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
          TRIVY_IGNOREFILE: /dev/null

      - name: Summarize findings and fail on fixable High/Critical entries
        env:
          SCANNED_IMAGE: ${{ matrix.image }}
        run: python3 .github/scripts/check-image-scan.py --report "$RUNNER_TEMP/scan.json" --image "$SCANNED_IMAGE"

      - name: Preserve the scan report even when the gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-scan-${{ matrix.id }}
          path: ${{ runner.temp }}/scan.json
          retention-days: 14
          if-no-files-found: warn
