- name: Kafka offline leader and replication health are detected
  interval: 1m
  input_series:
  - *id001
  - *id006
  - *id002
  - *id003
  - *id004
  - *id005
  - series: kafka_topic_partition_leader{dependency="kafka",namespace="dev",partition="0",project="otel-demo",topic="orders"}
    values: -1x20
  - series: kafka_topic_partition_under_replicated_partition{dependency="kafka",namespace="dev",partition="0",project="otel-demo",topic="orders"}
    values: 1x20
  alert_rule_test:
  - eval_time: 15m
    alertname: OtelDemoDependencyMetricsUnavailable
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoDependencyServerMetricsMissing
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoKafkaConsumerLagHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoKafkaConsumerGroupInactive
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoKafkaPartitionsUnderReplicated
    exp_alerts:
    - exp_labels:
        namespace: dev
        topic: orders
        severity: warning
        project: otel-demo
        dependency: kafka
      exp_annotations:
        summary: Kafka topic orders has under-replicated partitions
        description: At least one partition lacks its configured in-sync replicas. Check broker availability, storage and
          replication. The current single-broker, replication-factor-one deployment has no broker redundancy.
  - eval_time: 15m
    alertname: OtelDemoKafkaPartitionWithoutLeader
    exp_alerts:
    - exp_labels:
        namespace: dev
        project: otel-demo
        dependency: kafka
        topic: orders
        partition: '0'
        severity: critical
      exp_annotations:
        summary: Kafka orders/0 has no leader
        description: Partition 0 on orders has no leader for 2 minutes. Check the broker/controller and its storage; affected
          producers and consumers cannot make progress.
  - eval_time: 15m
    alertname: OtelDemoPostgresUnavailable
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoPostgresConnectionsNearLimit
