        namespace: dev
        dependency: postgres
        severity: warning
        project: otel-demo
        collector: stat_activity
      exp_annotations:
        summary: postgres metric collection fails despite backend connectivity
        description: The exporter can reach its backend but has metric collection errors for 3 minutes. Check collector permissions,
          supported commands, query timeouts and exporter logs. Some server metrics may be missing.
    - exp_labels:
        namespace: dev
        dependency: valkey
        severity: warning
        project: otel-demo
      exp_annotations:
        summary: valkey metric collection fails despite backend connectivity
        description: The exporter can reach its backend but has metric collection errors for 3 minutes. Check collector permissions,
          supported commands, query timeouts and exporter logs. Some server metrics may be missing.
