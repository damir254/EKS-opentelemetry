rule_files:
- otel-demo-rules.yaml
- otel-demo-dependency-rules.yaml
evaluation_interval: 1m
tests:
- name: Healthy idle dependencies do not alert
  interval: 1m
  input_series:
  - &id001
    series: up{dependency="kafka",namespace="dev",project="otel-demo"}
    values: 1x20
  - &id006
    series: up{dependency="postgres",namespace="dev",project="otel-demo"}
    values: 1x20
  - &id002
    series: up{dependency="valkey",namespace="dev",project="otel-demo"}
    values: 1x20
  - &id003
    series: kafka_brokers{dependency="kafka",namespace="dev",project="otel-demo"}
    values: 1x20
  - &id004
    series: pg_up{dependency="postgres",namespace="dev",project="otel-demo"}
    values: 1x20
  - &id005
    series: redis_up{dependency="valkey",namespace="dev",project="otel-demo"}
    values: 1x20
  - &id055
    series: kafka_consumergroup_lag{consumergroup="accounting",dependency="kafka",namespace="dev",partition="0",project="otel-demo",topic="orders"}
    values: '0x20'
  - &id056
    series: kafka_consumergroup_members{consumergroup="accounting",dependency="kafka",namespace="dev",project="otel-demo"}
    values: '0x20'
  - &id057
    series: pg_stat_database_numbackends{datname="astronomy_db",dependency="postgres",namespace="dev",project="otel-demo"}
    values: 20x20
  - &id058
    series: pg_settings_max_connections{dependency="postgres",namespace="dev",project="otel-demo"}
    values: 100x20
  alert_rule_test:
  - eval_time: 15m
    alertname: OtelDemoDependencyMetricsUnavailable
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoDependencyServerMetricsMissing
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoKafkaConsumerLagHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoKafkaConsumerGroupInactive
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoKafkaPartitionsUnderReplicated
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoKafkaPartitionWithoutLeader
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoPostgresUnavailable
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoPostgresConnectionsNearLimit
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoPostgresLockWaits
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoPostgresLongTransaction
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoPostgresDeadlocks
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoValkeyUnavailable
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoValkeyMemoryPressure
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoValkeyEvictingKeys
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoValkeyRejectingConnections
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoValkeyPersistenceFailure
    exp_alerts: []
  - eval_time: 15m
    alertname: OtelDemoDependencyCollectionErrors
    exp_alerts: []
