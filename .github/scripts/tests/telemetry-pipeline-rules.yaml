# Behavioral alert tests: idle traffic, healthy delivery, failures and missing targets.
rule_files:
- telemetry-pipeline.yaml
evaluation_interval: 1m
tests:
- name: Healthy idle pipelines do not alarm
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryComponentScrapeUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorApplicationScrapeUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorInternalMetricsMissing
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorRefusingData
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorExportFailures
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorQueueDroppingData
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorQueueNearCapacity
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryApplicationServerSpansMissing
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLogDeliveryStalled
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLokiRequestFailures
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLokiDiscardingLogs
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLokiFlushFailures
    exp_alerts: []
- name: Healthy active pipelines do not alarm
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+60x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+60x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+60x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryComponentScrapeUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorApplicationScrapeUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorInternalMetricsMissing
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorRefusingData
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorExportFailures
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorQueueDroppingData
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryCollectorQueueNearCapacity
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryApplicationServerSpansMissing
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLogDeliveryStalled
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLokiRequestFailures
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLokiDiscardingLogs
    exp_alerts: []
  - eval_time: 20m
    alertname: TelemetryLokiFlushFailures
    exp_alerts: []
- name: Failed collector target is detected
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 0+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryComponentScrapeUnavailable
    exp_alerts:
    - exp_labels:
        namespace: dev
        pod: otel-collector-ci
        telemetry_component: collector
        service: otel-collector
        endpoint: http-internal
        severity: critical
        project: otel-demo
      exp_annotations:
        summary: Cannot scrape collector internal metrics
        description: Prometheus has failed to scrape, or no longer discovers, the collector metrics target in dev
          for 3 minutes. Check the ServiceMonitor, Service endpoints, pod readiness and network policies. Pipeline
          health is unknown.
