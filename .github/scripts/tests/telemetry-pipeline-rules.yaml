- name: Missing application scrape is detected
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryCollectorApplicationScrapeUnavailable
    exp_alerts:
    - exp_labels:
        namespace: dev
        service: otel-collector
        endpoint: http-metrics
        severity: critical
        project: otel-demo
        telemetry_component: collector
      exp_annotations:
        summary: Collector application metrics cannot be scraped
        description: The Collector's application metrics endpoint on 8889 has failed scrapes or disappeared for
          3 minutes. RED and native application metrics are unavailable even if the internal endpoint is healthy.
- name: Successful scrape without internal metrics is not healthy
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryCollectorInternalMetricsMissing
    exp_alerts:
    - exp_labels:
        namespace: dev
        telemetry_component: collector
        severity: warning
        project: otel-demo
      exp_annotations:
        summary: Collector scrape succeeds but expected internal metrics are missing
        description: The internal scrape is reachable, but otelcol_process_uptime has been absent for at least 5
          minutes. Check internal telemetry configuration, metric relabeling and Collector version changes.
- name: Refused telemetry alarms
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  - series: otelcol_receiver_refused_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+60x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryCollectorRefusingData
    exp_alerts:
    - exp_labels:
        namespace: dev
        pod: otel-collector-ci
        telemetry_component: collector
        receiver: otlp
        severity: warning
        project: otel-demo
      exp_annotations:
        summary: Collector is refusing telemetry from otlp
        description: Receiver otlp in dev/otel-collector-ci has refused telemetry for 2 minutes. Check memory-limiter
          pressure, processor errors and application SDK export errors. SDK retries determine whether refused data
          is ultimately lost.
- name: Export failures alarm
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  - series: otelcol_exporter_send_failed_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+60x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryCollectorExportFailures
    exp_alerts:
    - exp_labels:
        namespace: dev
        pod: otel-collector-ci
        telemetry_component: collector
        exporter: otlphttp/loki
        severity: warning
        project: otel-demo
      exp_annotations:
        summary: Collector exporter otlphttp/loki is failing
        description: Exporter otlphttp/loki in dev/otel-collector-ci has export failures for 2 minutes. Check the
          receiving backend, network policies and Collector logs. Failures can be retried and do not alone establish
          data loss.
- name: Queue enqueue failures alarm
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  - series: otelcol_exporter_enqueue_failed_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+60x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryCollectorQueueDroppingData
    exp_alerts:
    - exp_labels:
        namespace: dev
        pod: otel-collector-ci
        telemetry_component: collector
        exporter: otlphttp/loki
        severity: critical
        project: otel-demo
      exp_annotations:
        summary: Collector exporter otlphttp/loki cannot enqueue telemetry
        description: Telemetry cannot enter the sending queue for otlphttp/loki in dev/otel-collector-ci. Check
          queue capacity, in-flight retries and backend availability. Data may be lost.
- name: Sustained queue pressure alarms
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
    values: 1+0x40
  - series: otelcol_process_uptime{telemetry_component="collector",namespace="dev",pod="otel-collector-ci"}
    values: 0+60x40
  - series: otelcol_receiver_accepted_spans{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_receiver_accepted_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",receiver="otlp"}
    values: 0+0x40
  - series: otelcol_exporter_sent_log_records{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 0+0x40
  - series: otel_demo_span_metrics_calls_total{project="otel-demo",namespace="dev",service_name="recommendation",span_kind="SPAN_KIND_SERVER"}
    values: 0+0x40
  - series: otelcol_exporter_queue_size{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 9+0x40
  - series: otelcol_exporter_queue_capacity{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",exporter="otlphttp/loki"}
    values: 10+0x40
  alert_rule_test:
  - eval_time: 20m
    alertname: TelemetryCollectorQueueNearCapacity
    exp_alerts:
    - exp_labels:
        namespace: dev
        pod: otel-collector-ci
        telemetry_component: collector
        exporter: otlphttp/loki
        severity: warning
        project: otel-demo
      exp_annotations:
        summary: Collector exporter otlphttp/loki queue exceeds 80%
        description: The sending queue for otlphttp/loki has exceeded 80% of capacity for 5 minutes. Inspect backend
          throughput and in-flight retries before raising queue size; queues consume memory.
- name: Queue at exactly eighty percent does not alarm
  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{telemetry_component="loki",namespace="monitoring",pod="loki-0"}
