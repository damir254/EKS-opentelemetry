  interval: 1m
  input_series:
  - series: up{telemetry_component="collector",namespace="dev",pod="otel-collector-ci",service="otel-collector",endpoint="http-internal"}
    values: 1+0x40
  - series: up{namespace="dev",service="otel-collector",endpoint="http-metrics"}
