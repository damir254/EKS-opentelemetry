# Active RDS backend, initialized by the monitoring database chart before Grafana.
grafana:
  # ESO supplies a stable login for Grafana and its dashboard/datasource sidecars.
  # The initial password seeds an empty RDS database; existing accounts need reset.
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  persistence:
    enabled: false
  podDisruptionBudget:
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: monitoring
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
          app.kubernetes.io/instance: monitoring
  headlessService: true
  envValueFrom:
    GF_SERVER_DOMAIN:
      configMapKeyRef:
        name: platform-dashboard-hosts
        key: grafanaHostname
        optional: true
    GF_SERVER_ROOT_URL:
      configMapKeyRef:
        name: platform-dashboard-hosts
        key: grafanaRootURL
        optional: true
    GF_SECURITY_COOKIE_SECURE:
      configMapKeyRef:
        name: platform-dashboard-hosts
        key: grafanaCookieSecure
  extraConfigmapMounts:
    - name: rds-ca
      configMap: grafana-rds-ca
      mountPath: /etc/grafana/rds-ca
      readOnly: true
  extraSecretMounts:
    - name: grafana-oidc
      secretName: monitoring-grafana-oidc
      mountPath: /etc/grafana/oidc
      readOnly: true
    - name: grafana-database
      secretName: monitoring-grafana-db
      mountPath: /etc/grafana/database
      readOnly: true
  grafana.ini:
    database:
      type: postgres
      host: $__file{/etc/grafana/database/host}
      name: grafana
      user: $__file{/etc/grafana/database/username}
      password: $__file{/etc/grafana/database/password}
      ssl_mode: verify-full
      ca_cert_path: /etc/grafana/rds-ca/bundle.pem
      max_open_conn: 10
      max_idle_conn: 3
      migration_locking: true
      locking_attempt_timeout_sec: 60
    security:
      secret_key: $__file{/etc/grafana/database/secret_key}
      cookie_secure: true
    auth:
      disable_login_form: false
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      client_secret: $__file{/etc/grafana/oidc/client-secret}
      scopes: openid profile email groups
      auth_url: https://auth.damircloud.com/realms/platform/protocol/openid-connect/auth
      token_url: https://auth.damircloud.com/realms/platform/protocol/openid-connect/token
      api_url: https://auth.damircloud.com/realms/platform/protocol/openid-connect/userinfo
      use_pkce: true
      use_refresh_token: true
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      allowed_groups: platform-admins platform-viewers
      role_attribute_path: "contains(groups[*], 'platform-admins') && 'Admin' || contains(groups[*], 'platform-viewers') && 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: false
      signout_redirect_url: https://auth.damircloud.com/realms/platform/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.damircloud.com%2Flogin
    unified_alerting:
      ha_listen_address: ${POD_IP}:9094
      ha_advertise_address: ${POD_IP}:9094
      ha_peers: monitoring-grafana-headless.monitoring.svc.cluster.local:9094
