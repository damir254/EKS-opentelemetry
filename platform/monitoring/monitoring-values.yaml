grafana:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

alertmanager:
  enabled: true