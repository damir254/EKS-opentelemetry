grafana:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    # Applied to each sidecar; dashboard/datasource watchers use ~72Mi each.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

# Reuse the stack's HPA alert instead of emitting a duplicate project alert.
customRules:
  KubeHpaMaxedOut:
    for: 10m
defaultRules:
  rules:
    kubeProxy: false
  additionalRuleAnnotations:
    KubeHpaMaxedOut:
      description: >-
        HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has
        been at its maximum replica count for at least 10 minutes. Review
        workload demand, the replica limit, and available cluster capacity.

# Auto Mode runs these components as node services rather than scrapeable pods.
coreDns:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  prometheusConfigReloader:
    # The operator applies these resources to Prometheus and Alertmanager reloaders.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d

    resources:
      requests:
        cpu: 100m
        # Observed working set is ~550Mi before traffic; leave room for ingestion.
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 1Gi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Scope project rules by the existing Helm labels, without exporting all labels.
  metricLabelsAllowlist:
    - deployments=[app.kubernetes.io/name,app.kubernetes.io/instance]

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        # Preserve the operator's existing 200Mi memory reservation.
        memory: 200Mi
      limits:
        cpu: 200m
        memory: 256Mi
