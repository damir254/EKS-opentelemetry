grafana:
  enabled: true
  grafana.ini:
    server:
      domain: grafana.damircloud.com
      root_url: https://grafana.damircloud.com/
    security:
      cookie_secure: true
    auth.anonymous:
      enabled: false
    analytics:
      # Platform egress allows SSO and internal backends; no update/reporting calls.
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  # Database and availability settings come from grafana-ha-values.yaml.
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    # Applied to each sidecar; dashboard/datasource watchers use ~72Mi each.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 100m
        memory: 256Mi
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

# Reuse the stack's HPA alert instead of emitting a duplicate project alert.
customRules:
  KubeHpaMaxedOut:
    for: 10m
defaultRules:
  rules:
    kubeProxy: false
  additionalRuleAnnotations:
    KubeHpaMaxedOut:
      description: >-
        HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has
        been at its maximum replica count for at least 10 minutes. Review
        workload demand, the replica limit, and available cluster capacity.

# Auto Mode runs these components as node services rather than scrapeable pods.
coreDns:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  prometheusConfigReloader:
    # The operator applies these resources to Prometheus and Alertmanager reloaders.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

prometheus:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  service:
    # Replicas scrape independently; keep a client on one replica for consistent queries.
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800
  prometheusSpec:
    replicas: 2
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    replicaExternalLabelName: prometheus_replica
    retention: 7d
    # Leave space for the WAL, head chunks, and compaction on the 10Gi volume.
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

    resources:
      requests:
        cpu: 100m
        # Observed working set is ~550Mi before traffic; leave room for ingestion.
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 1Gi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Scope project rules by the existing Helm labels, without exporting all labels.
  metricLabelsAllowlist:
    - deployments=[app.kubernetes.io/name,app.kubernetes.io/instance]

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

alertmanager:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  alertmanagerSpec:
    # The operator configures the gossip cluster when replicas exceeds one.
    replicas: 2
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    # Preserve silences and the notification log across pod replacements.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    resources:
      requests:
        cpu: 25m
        # Observed peak is ~20Mi; leave room for active alerts and gossip.
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
