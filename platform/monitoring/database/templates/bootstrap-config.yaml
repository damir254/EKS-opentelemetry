apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-db-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-db-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  fetch.sh: |
    {{- .Files.Get "scripts/fetch.sh" | nindent 4 }}
  prepare.py: |
    {{- .Files.Get "scripts/prepare.py" | nindent 4 }}
  initialize.sh: |
    {{- .Files.Get "scripts/initialize.sh" | nindent 4 }}
  publish.sh: |
    {{- .Files.Get "scripts/publish.sh" | nindent 4 }}
