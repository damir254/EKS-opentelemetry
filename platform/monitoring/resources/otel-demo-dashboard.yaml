apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-demo-platform-health
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: otel-demo
data:
  otel-demo-platform-health.json: |
    {
      "uid": "otel-demo-platform-health",
      "title": "Otel Demo - Platform Health",
      "description": "Deployment, Rollout and StatefulSet health for the otel-demo Helm release in dev. Uses kube-prometheus-stack metrics, project ownership records and the existing Prometheus data source.",
      "tags": [
        "otel-demo",
        "platform",
        "kubernetes"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(otel_demo:workload:info, namespace)",
              "refId": "namespace"
            },
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "dev",
              "value": "dev"
            }
          },
          {
            "name": "workload",
            "label": "Deployment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(otel_demo:workload:info{namespace=~\"${namespace:regex}\"}, workload)",
              "refId": "workload"
            },
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Workload replicas",
          "description": "Desired versus available replicas. StatefulSets use ready replicas; Rollouts use the desired baseline and available pods, which may exceed it during a canary surge.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otel_demo:workload:replicas_desired{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} desired",
              "range": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otel_demo:workload:replicas_available{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} available",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "title": "Active pods by workload",
          "description": "Pending, Running and Unknown pods belonging to selected workloads. Completed pods and Jobs are excluded; zero is shown for workloads without active pods.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (namespace, workload, workload_type) (otel_demo:pod:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}) or on (namespace, workload, workload_type) (0 * otel_demo:workload:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"})",
              "legendFormat": "{{workload_type}} / {{workload}}",
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "title": "Container restart rate",
          "description": "Restarts per minute over the query interval. The project alert uses more than 3 restarts over 15 minutes, sustained for 2 minutes.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix:restarts/min",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (namespace, pod, container) (rate(kube_pod_container_status_restarts_total{job=\"kube-state-metrics\", namespace=~\"${namespace:regex}\"}[$__rate_interval])) * 60 * on (namespace, pod) group_left (workload, workload_type) otel_demo:pod:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} / {{pod}} / {{container}}",
              "range": true
            }
          ]
        },
        {
          "id": 4,
          "title": "CPU usage by pod",
          "description": "CPU cores consumed by containers, grouped by their actual workload ownership. Excludes the infrastructure/POD container.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix:cores",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod) (max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", namespace=~\"${namespace:regex}\", container!=\"\", container!=\"POD\", image!=\"\"}[$__rate_interval]))) * on (namespace, pod) group_left (workload, workload_type) otel_demo:pod:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} / {{pod}}",
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "title": "Memory working set by pod",
          "description": "Working-set bytes of containers, grouped by their actual workload ownership.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod) (max by (namespace, pod, container) (container_memory_working_set_bytes{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", namespace=~\"${namespace:regex}\", container!=\"\", container!=\"POD\", image!=\"\"})) * on (namespace, pod) group_left (workload, workload_type) otel_demo:pod:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} / {{pod}}",
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "title": "HPA replicas",
          "description": "Current, desired and maximum replicas for HPAs targeting selected workloads. No series is expected for workloads without an HPA. KubeHpaMaxedOut warns after 10 minutes at maximum, excluding fixed-size HPAs.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_current_replicas{job=\"kube-state-metrics\", namespace=~\"${namespace:regex}\"}) * on (namespace, horizontalpodautoscaler) group_left (workload, workload_type) otel_demo:hpa:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} / {{horizontalpodautoscaler}} current",
              "range": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_desired_replicas{job=\"kube-state-metrics\", namespace=~\"${namespace:regex}\"}) * on (namespace, horizontalpodautoscaler) group_left (workload, workload_type) otel_demo:hpa:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} / {{horizontalpodautoscaler}} desired",
              "range": true
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_spec_max_replicas{job=\"kube-state-metrics\", namespace=~\"${namespace:regex}\"}) * on (namespace, horizontalpodautoscaler) group_left (workload, workload_type) otel_demo:hpa:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"}",
              "legendFormat": "{{workload_type}} / {{workload}} / {{horizontalpodautoscaler}} max",
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "title": "Firing workload alerts",
          "description": "Firing custom and default alerts associated with the selected workloads, their active pods, or their HPAs. An empty table means no matching firing alerts when metrics are available.",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (namespace, alertname, severity, workload, workload_type, pod, container, horizontalpodautoscaler) (\n  (label_replace(label_replace(ALERTS{alertstate=\"firing\", namespace=~\"${namespace:regex}\", deployment!=\"\"}, \"workload\", \"$1\", \"deployment\", \"(.+)\"), \"workload_type\", \"deployment\", \"workload\", \".+\") * on (namespace, workload, workload_type) group_left () otel_demo:workload:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"})\n  or\n  (label_replace(label_replace(ALERTS{alertstate=\"firing\", namespace=~\"${namespace:regex}\", statefulset!=\"\"}, \"workload\", \"$1\", \"statefulset\", \"(.+)\"), \"workload_type\", \"statefulset\", \"workload\", \".+\") * on (namespace, workload, workload_type) group_left () otel_demo:workload:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"})\n  or\n  (ALERTS{alertstate=\"firing\", namespace=~\"${namespace:regex}\", workload!=\"\"} * on (namespace, workload, workload_type) group_left () otel_demo:workload:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"})\n  or\n  (ALERTS{alertstate=\"firing\", namespace=~\"${namespace:regex}\", deployment=\"\", statefulset=\"\", workload=\"\", pod!=\"\"} * on (namespace, pod) group_left (workload, workload_type) otel_demo:pod:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"})\n  or\n  (ALERTS{alertstate=\"firing\", namespace=~\"${namespace:regex}\", deployment=\"\", statefulset=\"\", workload=\"\", pod=\"\", horizontalpodautoscaler!=\"\"} * on (namespace, horizontalpodautoscaler) group_left (workload, workload_type) otel_demo:hpa:info{namespace=~\"${namespace:regex}\", workload=~\"${workload:regex}\"})\n)",
              "instant": true,
              "range": false,
              "format": "table",
              "legendFormat": ""
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "alertname",
                    "severity",
                    "namespace",
                    "workload",
                    "workload_type",
                    "pod",
                    "container",
                    "horizontalpodautoscaler"
                  ]
                }
              }
            }
          ]
        }
      ]
    }
