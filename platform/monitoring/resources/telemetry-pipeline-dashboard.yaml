apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-pipeline-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: otel-demo
data:
  telemetry-pipeline.json: |
    {
      "uid": "otel-demo-telemetry-pipeline",
      "title": "Otel Demo - Telemetry Pipeline",
      "description": "Collector and Loki pipeline health. No data is unknown, not healthy. Scrape status, refusals, export errors, queue pressure and storage failures complement application RED metrics. Thresholds are initial operational defaults, not measured capacity limits.",
      "tags": [
        "otel-demo",
        "telemetry",
        "collector",
        "loki"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Application namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(up{telemetry_component=\"collector\"}, namespace)",
              "refId": "namespace"
            },
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "dev",
              "value": "dev"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Collector internal scrape",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(up{telemetry_component=\"collector\", namespace=\"$namespace\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Unavailable",
                      "color": "red"
                    },
                    "1": {
                      "text": "Up",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          }
        },
        {
          "id": 2,
          "title": "Application metrics scrape",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(up{namespace=\"$namespace\", service=\"otel-collector\", endpoint=\"http-metrics\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Unavailable",
                      "color": "red"
                    },
                    "1": {
                      "text": "Up",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          }
        },
        {
          "id": 3,
          "title": "Loki scrape",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(up{telemetry_component=\"loki\", namespace=\"monitoring\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Unavailable",
                      "color": "red"
                    },
                    "1": {
                      "text": "Up",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          }
        },
        {
          "id": 4,
          "title": "Firing pipeline alerts",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{project=\"otel-demo\", alertname=~\"Telemetry.*\", alertstate=\"firing\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          }
        },
        {
          "id": 5,
          "title": "Received spans",
          "description": "Accepted spans from backend and browser receivers. Receive counts alone do not prove SERVER-span coverage.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (receiver) (rate(otelcol_receiver_accepted_spans{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "{{receiver}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "title": "Received metric points",
          "description": "Native OTLP and span-metrics input, per receiver.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (receiver) (rate(otelcol_receiver_accepted_metric_points{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "{{receiver}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "title": "Log input and delivery to Loki",
          "description": "Accepted log records versus successful exports to Loki. Persistent divergence suggests delivery problems; short differences can be batching.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(otelcol_receiver_accepted_log_records{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Received",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(otelcol_exporter_sent_log_records{telemetry_component=\"collector\", namespace=\"$namespace\", exporter=\"otlphttp/loki\"}[$__rate_interval]))",
              "legendFormat": "Exported to Loki",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "title": "Refused telemetry",
          "description": "Receiver failures may be retried by SDKs. Counts represent spans, metric points or log records, not bytes.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (receiver) (rate(otelcol_receiver_refused_spans{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Spans {{receiver}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (receiver) (rate(otelcol_receiver_refused_metric_points{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Metric points {{receiver}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (receiver) (rate(otelcol_receiver_refused_log_records{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Logs {{receiver}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "title": "Export and enqueue failures",
          "description": "Export failures can be retried. Enqueue failures indicate telemetry could not enter the sending queue.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (exporter) (rate(otelcol_exporter_send_failed_spans{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Spans send_failed {{exporter}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (exporter) (rate(otelcol_exporter_send_failed_metric_points{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Metric points send_failed {{exporter}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (exporter) (rate(otelcol_exporter_send_failed_log_records{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Logs send_failed {{exporter}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (exporter) (rate(otelcol_exporter_enqueue_failed_spans{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Spans enqueue_failed {{exporter}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (exporter) (rate(otelcol_exporter_enqueue_failed_metric_points{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Metric points enqueue_failed {{exporter}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "F",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (exporter) (rate(otelcol_exporter_enqueue_failed_log_records{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "Logs enqueue_failed {{exporter}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "title": "Exporter queue utilization",
          "description": "Sending queue usage. A drained queue can coexist with an in-flight request retrying; inspect both panels.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * otelcol_exporter_queue_size{telemetry_component=\"collector\", namespace=\"$namespace\"} / clamp_min(otelcol_exporter_queue_capacity{telemetry_component=\"collector\", namespace=\"$namespace\"}, 1)",
              "legendFormat": "{{exporter}} {{pod}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "title": "In-flight export requests",
          "description": "Includes export requests waiting in retry backoff. These requests are no longer counted in queue size.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otelcol_exporter_in_flight_requests{telemetry_component=\"collector\", namespace=\"$namespace\"}",
              "legendFormat": "{{exporter}} {{pod}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "title": "Collector CPU and configured budget",
          "description": "CPU cores used compared with pod requests and limits. Use sustained representative traffic to establish capacity.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(otelcol_process_cpu_seconds{telemetry_component=\"collector\", namespace=\"$namespace\"}[$__rate_interval])",
              "legendFormat": "Used {{pod}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (pod) (kube_pod_container_resource_requests{namespace=\"$namespace\", container=\"otel-collector\", resource=\"cpu\", unit=\"core\"})",
              "legendFormat": "Request {{pod}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\", container=\"otel-collector\", resource=\"cpu\", unit=\"core\"})",
              "legendFormat": "Limit {{pod}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "title": "Collector memory and container limit",
          "description": "Process RSS and the Kubernetes memory limit. Receiver refusals show memory-limiter effects; queue capacity also consumes memory.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otelcol_process_memory_rss{telemetry_component=\"collector\", namespace=\"$namespace\"}",
              "legendFormat": "RSS {{pod}}",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\", container=\"otel-collector\", resource=\"memory\", unit=\"byte\"})",
              "legendFormat": "Limit {{pod}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "title": "Loki HTTP requests",
          "description": "Loki HTTP responses by route and status, covering ingestion and queries.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route, status_code) (rate(loki_request_duration_seconds_count{telemetry_component=\"loki\", namespace=\"monitoring\"}[$__rate_interval]))",
