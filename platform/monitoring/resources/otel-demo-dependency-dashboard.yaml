apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-demo-dependency-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: otel-demo
data:
  otel-demo-dependencies.json: |
    {
      "uid": "otel-demo-dependencies",
      "title": "Otel Demo - Dependencies",
      "description": "Dependency server metrics complement Application RED and Platform Health. Kafka API metrics cover group offsets and partition health; missing metrics are unknown. Initial alert thresholds require load testing.",
      "tags": [
        "otel-demo",
        "dependencies",
        "kafka",
        "postgres",
        "valkey"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(up{project=\"otel-demo\", dependency=~\"kafka|postgres|valkey\"}, namespace)",
              "refId": "namespace"
            },
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "dev",
              "value": "dev"
            }
          },
          {
            "name": "topic",
            "label": "Kafka topic",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kafka_topic_partitions{project=\"otel-demo\", namespace=\"$namespace\"}, topic)",
              "refId": "topic"
            },
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "orders",
              "value": "orders"
            }
          },
          {
            "name": "consumergroup",
            "label": "Consumer group",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(otel_demo:kafka:consumer_lag{namespace=\"$namespace\", topic=~\"${topic:regex}\"}, consumergroup)",
              "refId": "consumergroup"
            },
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Kafka exporter scrape",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(up{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"kafka\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Unavailable",
                      "color": "red"
                    },
                    "1": {
                      "text": "Up",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          },
          "description": "Scrape reachability. PostgreSQL/Valkey backend connectivity appears below; a reachable exporter alone does not establish server health."
        },
        {
          "id": 2,
          "title": "PostgreSQL exporter scrape",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(up{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Unavailable",
                      "color": "red"
                    },
                    "1": {
                      "text": "Up",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          },
          "description": "Scrape reachability. PostgreSQL/Valkey backend connectivity appears below; a reachable exporter alone does not establish server health."
        },
        {
          "id": 3,
          "title": "Valkey exporter scrape",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(up{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"valkey\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Unavailable",
                      "color": "red"
                    },
                    "1": {
                      "text": "Up",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          },
          "description": "Scrape reachability. PostgreSQL/Valkey backend connectivity appears below; a reachable exporter alone does not establish server health."
        },
        {
          "id": 4,
          "title": "Firing dependency alerts",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{project=\"otel-demo\", namespace=\"$namespace\", alertname=~\"OtelDemo(Dependency|Kafka|Postgres|Valkey).*\", alertstate=\"firing\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "background"
          },
          "description": "Initial operational alerts; no active alerts is not proof of complete metrics."
        },
        {
          "id": 5,
          "title": "Kafka broker and partition health",
          "description": "API-derived metadata. One broker and replication factor one provide no broker redundancy. This does not collect JVM/JMX or broker request-handler timings.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(kafka_brokers{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"kafka\"})",
              "legendFormat": "Discovered brokers",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_topic_partition_under_replicated_partition{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"kafka\", topic=~\"${topic:regex}\"})",
              "legendFormat": "Under-replicated partitions",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_topic_partition_leader{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"kafka\", topic=~\"${topic:regex}\"} < bool 0)",
              "legendFormat": "Partitions without a leader",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "title": "Kafka committed-offset consumer lag",
          "description": "Records behind the end offset, summed across partitions per group/topic. Negative/uninitialized offsets are omitted. Missing groups are unknown; validate expected groups with real orders.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otel_demo:kafka:consumer_lag{namespace=\"$namespace\", topic=~\"${topic:regex}\", consumergroup=~\"${consumergroup:regex}\"}",
              "legendFormat": "{{consumergroup}} / {{topic}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "title": "Kafka group members",
          "description": "Active Kafka group members, not pod replicas. A pod may create multiple consumer instances. More consumers than partitions do not add partition-processing parallelism.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_consumergroup_members{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"kafka\", consumergroup=~\"${consumergroup:regex}\"}",
              "legendFormat": "{{consumergroup}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "title": "Kafka offset progress",
          "description": "Approximate offset slopes, not request counters. Offset resets, retention and topic recreation can distort these rates. Consumer commits can be batched.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (topic) (clamp_min(deriv(kafka_topic_partition_current_offset{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"kafka\", topic=~\"${topic:regex}\"}[$__rate_interval]), 0))",
              "legendFormat": "{{topic}} produced records/s",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (consumergroup, topic) (clamp_min(deriv(kafka_consumergroup_current_offset{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"kafka\", topic=~\"${topic:regex}\", consumergroup=~\"${consumergroup:regex}\"}[$__rate_interval]), 0))",
              "legendFormat": "{{consumergroup}} / {{topic}} committed records/s",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "title": "Backend connectivity and collection health",
          "description": "A reachable backend can still have partial collection failures. All health series use 1 for success and 0 for failure. Missing data is unknown.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "pg_up{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"}",
              "legendFormat": "PostgreSQL monitoring query",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "redis_up{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"valkey\"}",
              "legendFormat": "Valkey monitoring query",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(pg_scrape_collector_success{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"})",
              "legendFormat": "PostgreSQL collectors healthy",
              "range": true,
              "instant": false
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - clamp_max(max(redis_exporter_last_scrape_error{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"valkey\"}), 1)",
              "legendFormat": "Valkey collection healthy",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "title": "PostgreSQL connections and limit",
          "description": "Server-wide connection pressure. Application replica scaling can multiply pools and exhaust database connections. The 80% alert leaves initial headroom for reserved connections.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(pg_stat_database_numbackends{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"})",
              "legendFormat": "Connections across databases",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(pg_settings_max_connections{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"})",
              "legendFormat": "max_connections",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "title": "PostgreSQL lock waits and oldest transaction",
          "description": "Waiting sessions use the left axis; oldest transaction age uses the right axis. Inspect blocking transactions when waits persist.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (datname) (pg_stat_activity_count{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\", wait_event_type=\"Lock\"})",
              "legendFormat": "{{datname}} waiting sessions",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (datname) (pg_stat_activity_max_tx_duration{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"})",
              "legendFormat": "{{datname}} oldest transaction seconds",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.axisLabel",
                    "value": "Transaction age (seconds)"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "title": "PostgreSQL transaction and deadlock rates",
          "description": "Database outcomes complement application errors. Rollbacks include normal application behavior and do not alone establish a failure.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (datname) (rate(pg_stat_database_xact_commit{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"}[$__rate_interval]))",
              "legendFormat": "{{datname}} commits/s",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (datname) (rate(pg_stat_database_xact_rollback{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"}[$__rate_interval]))",
              "legendFormat": "{{datname}} rollbacks/s",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (datname) (rate(pg_stat_database_deadlocks{project=\"otel-demo\", namespace=\"$namespace\", dependency=\"postgres\"}[$__rate_interval]))",
              "legendFormat": "{{datname}} deadlocks/s",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "title": "PostgreSQL held locks",
          "description": "Ordinary locks are expected. Diagnose contention using waiting sessions and blocking transactions, rather than treating every held lock as an error.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
