apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-demo-application-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: otel-demo
data:
  otel-demo-application-red.json: |
    {
      "uid": "otel-demo-application-red",
      "title": "Otel Demo - Application RED",
      "description": "Trace-derived RED metrics from the existing Collector and Prometheus. Counts received SERVER spans, including HTTP and RPC; depends on tracing coverage, sampling and correct span error status. No series means telemetry has not been observed or has expired.",
      "tags": [
        "otel-demo",
        "application",
        "RED"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(otel_demo:server_calls:rate5m{namespace=\"default\"}, service_name)",
              "refId": "service"
            },
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Server request rate",
          "description": "SERVER spans per second, averaged over 5 minutes. Client and internal spans are excluded.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otel_demo:server_calls:rate5m{namespace=\"default\", service_name=~\"${service:regex}\"}",
              "legendFormat": "{{service_name}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 2,
          "title": "Server error percentage",
          "description": "OTel ERROR SERVER spans / all SERVER spans, over 5 minutes. Missing error series are treated as zero; an observed idle service shows 0%.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * otel_demo:server_errors:ratio5m{namespace=\"default\", service_name=~\"${service:regex}\"}",
              "legendFormat": "{{service_name}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 3,
          "title": "P95 server latency",
          "description": "95th percentile SERVER span duration over 5 minutes, in seconds. No latency value is shown without traffic.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otel_demo:server_duration_seconds:p95_5m{namespace=\"default\", service_name=~\"${service:regex}\"}",
              "legendFormat": "{{service_name}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 4,
          "title": "P99 server latency",
          "description": "99th percentile SERVER span duration over 5 minutes, in seconds. Histogram buckets are aggregated across status and Collector instances before calculating the percentile.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otel_demo:server_duration_seconds:p99_5m{namespace=\"default\", service_name=~\"${service:regex}\"}",
              "legendFormat": "{{service_name}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 5,
          "title": "Request volume by service",
          "description": "Estimated SERVER span count in the selected time range. increase() accounts for counter resets.",
          "type": "bargauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sort_desc(sum by (namespace, service_name) (increase(otel_demo_span_metrics_calls_total{project=\"otel-demo\", namespace=\"default\", service_name=~\"${service:regex}\", service_name!=\"\", span_kind=\"SPAN_KIND_SERVER\"}[$__range])))",
              "legendFormat": "{{service_name}}",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 6,
          "title": "Server error request rate",
          "description": "Absolute ERROR SERVER spans per second, averaged over 5 minutes. This distinguishes error volume from percentage at low traffic.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "otel_demo:server_errors:rate5m{namespace=\"default\", service_name=~\"${service:regex}\"}",
              "legendFormat": "{{service_name}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 7,
          "title": "Firing RED alerts",
          "description": "Services exceeding the sustained error or p95 thresholds. Both alerts require at least 1 SERVER request/second. An empty table means no matching firing alerts when telemetry is available.",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{project=\"otel-demo\", namespace=\"default\", alertname=~\"OtelDemoHighErrorRate|OtelDemoHighP95Latency\", service_name=~\"${service:regex}\", alertstate=\"firing\"}",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "alertname",
                    "severity",
                    "namespace",
                    "service_name"
                  ]
                }
              }
            }
          ]
        }
      ]
    }
