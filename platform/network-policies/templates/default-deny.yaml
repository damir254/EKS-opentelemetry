{{- range $name, $settings := .Values.namespaces }}
{{- if $settings.defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-default-deny
  namespace: {{ $name }}
  annotations:
    # Workload allowlists are installed in wave -1, including Argo CD's API/DNS access.
    argocd.argoproj.io/sync-wave: "0"
  labels: {app.kubernetes.io/part-of: platform-network-policies}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- end }}
{{- end }}
