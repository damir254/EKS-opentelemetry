apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: keycloak}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: keycloak}
      # Optimize the pinned official distribution at a consistent path before
      # starting the read-only runtime. No custom image publication is required.
      initContainers:
        - name: copy-distribution
          image: {{ .Values.images.keycloak | quote }}
          command: ["/bin/bash", "-ec", "cp -R /opt/keycloak/. /runtime/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: distribution, mountPath: /runtime}
        - name: optimize-distribution
          image: {{ .Values.images.keycloak | quote }}
          args: ["build", "--db=postgres", "--health-enabled=true", "--metrics-enabled=true"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: distribution, mountPath: /opt/keycloak}
            - {name: temporary, mountPath: /tmp}
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak | quote }}
          args: ["start", "--optimized"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - {name: KC_HOSTNAME, value: {{ printf "https://%s" .Values.hostname | quote }}}
            - {name: KC_HOSTNAME_STRICT, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_PROXY_TRUSTED_ADDRESSES, value: "10.0.0.0/16"}
            - {name: KC_HTTP_MANAGEMENT_SCHEME, value: http}
            - {name: KC_DB_POOL_INITIAL_SIZE, value: "2"}
            - {name: KC_DB_POOL_MIN_SIZE, value: "2"}
            - {name: KC_DB_POOL_MAX_SIZE, value: "8"}
            - {name: KC_BOOTSTRAP_ADMIN_CLIENT_ID, value: platform-bootstrap}
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: keycloak-runtime, key: bootstrap_client_secret}
            - name: KC_DB_URL
              valueFrom:
                secretKeyRef: {name: keycloak-runtime, key: db_url}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: {name: keycloak-runtime, key: username}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-runtime, key: password}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
            - {name: cluster, containerPort: 7800}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: distribution, mountPath: /opt/keycloak}
            - {name: temporary, mountPath: /tmp}
            - {name: ca, mountPath: /etc/keycloak/rds-ca, readOnly: true}
      volumes:
        - name: distribution
          emptyDir: {sizeLimit: 1Gi}
        - name: temporary
          emptyDir: {sizeLimit: 64Mi}
        - name: ca
          configMap: {name: keycloak-rds-ca}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
---
{{- range $name := list "keycloak" "keycloak-admin" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}}
spec:
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- if eq $name "keycloak" }}
    - {name: management, port: 9000, targetPort: management}
{{- end }}
---
{{- end }}
