apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    # A Sync hook lets its wave -3 ServiceAccount, scripts and CA exist first.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak-db-bootstrap}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: keycloak-db-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-credentials
          image: {{ .Values.images.awsCli | quote }}
          command: ["/bin/sh", "/scripts/fetch.sh"]
          env:
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_PAGER
              value: ""
            - name: DB_INSTANCE_IDENTIFIER
              value: {{ .Values.databaseInstanceIdentifier | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /work}
        - name: prepare-login
          image: {{ .Values.images.python | quote }}
          command: ["python3", "-B", "/scripts/prepare.py", "/work"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /work}
        - name: initialize-database
          image: {{ .Values.images.postgres | quote }}
          command: ["/bin/sh", "/scripts/initialize.sh"]
          env:
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /ca/bundle.pem
            - name: PGCONNECT_TIMEOUT
              value: "10"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: ca, mountPath: /ca, readOnly: true}
      containers:
        - name: publish-credentials
          image: {{ .Values.images.awsCli | quote }}
          command: ["/bin/sh", "/scripts/publish.sh"]
          env:
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_PAGER
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: scripts
          configMap:
            name: keycloak-db-bootstrap
        - name: ca
          configMap:
            name: keycloak-rds-ca
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
