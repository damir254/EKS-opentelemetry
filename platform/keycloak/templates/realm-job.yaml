apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-configuration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: configure
          image: {{ .Values.images.python | quote }}
          command: ["python3", "-B", "/configuration/configure.py", "/credentials", "/configuration/realm.json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: configuration, mountPath: /configuration, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
      volumes:
        - name: configuration
          configMap: {name: keycloak-realm-configuration}
        - name: credentials
          secret: {secretName: keycloak-configuration, defaultMode: 0440}
