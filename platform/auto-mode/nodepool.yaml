apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: development
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Prefer this pool while built-in pools still exist during migration.
  weight: 100
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: development
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m7i-flex.large]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      expireAfter: 336h
      terminationGracePeriod: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
  limits:
    cpu: "12"
    memory: 48Gi
