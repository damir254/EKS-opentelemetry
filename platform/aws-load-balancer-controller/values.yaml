# Populate from Terraform outputs with scripts/configure-aws.py before bootstrap.
clusterName: otel-demo-eks
region: eu-central-1
vpcId: vpc-034798a528b2329a9

# The chart creates the internal CA/serving Certificates and CA-injection
# annotations. cert-manager owns the TLS Secret and renews the serving cert.
enableCertManager: true

replicaCount: 2
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  # EKS Pod Identity is associated by Terraform; no IAM role annotation is needed.

ingressClass: alb
createIngressClassResource: true

# This project only requires ALB Ingress reconciliation.
enableServiceMutatorWebhook: false
enableShield: false
enableWaf: false
enableWafv2: false
controllerConfig:
  featureGates:
    ALBGatewayAPI: false
    NLBGatewayAPI: false
    GlobalAcceleratorController: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
