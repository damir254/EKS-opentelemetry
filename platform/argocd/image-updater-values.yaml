crds:
  install: true

replicaCount: 1

serviceAccount:
  create: true
  name: argocd-image-updater-controller
  # IAM permissions come from the Terraform EKS Pod Identity association.

extraEnv:
  - name: AWS_REGION
    value: eu-central-1

config:
  registries:
  
    - name: project-ecr
      api_url: https://060941289716.dkr.ecr.eu-central-1.amazonaws.com
      prefix: 060941289716.dkr.ecr.eu-central-1.amazonaws.com
      ping: true
      credentials: ext:/scripts/ecr-login.sh
      credsexpire: 10h

authScripts:
  enabled: true
  scripts:
    ecr-login.sh: |
      #!/bin/sh
      set -eu
      # The pinned controller image contains aws-cli. Its default credential chain
      # reads the temporary credentials injected through EKS Pod Identity.
      password=$(aws ecr get-login-password --region "$AWS_REGION")
      printf 'AWS:%s\n' "$password"
