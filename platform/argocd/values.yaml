# Reserve observed usage plus headroom so Auto Mode can account for these pods.
# Limits allow bursts while bounding each container's CPU and memory use.
global:
  networkPolicy:
    # The network-policies Application owns ingress and egress allowlists.
    # Fresh installs use one policy owner; chart defaults allow all server ingress.
    create: false
configs:
  cm:
    url: https://argocd.damircloud.com
    admin.enabled: "true"
    oidc.config: |
      name: Keycloak
      issuer: https://auth.damircloud.com/realms/platform
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: [openid, profile, email, groups]
  rbac:
    policy.default: ""
    scopes: '[groups]'
    policy.csv: |
      g, platform-admins, role:admin
      g, platform-viewers, role:readonly
  params:
    server.insecure: false

controller:
  resources:
    requests:
      cpu: 250m
      # Observed memory peak is ~724Mi; retain reconciliation headroom.
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi

server:
  replicas: 2
  env:
    # Divide the shared login concurrency limit between the API replicas.
    - name: ARGOCD_API_SERVER_REPLICAS
      value: "2"
  pdb:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
              app.kubernetes.io/instance: argocd
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

repoServer:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
              app.kubernetes.io/instance: argocd
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  copyutil:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

notifications:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

dex:
  enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  initImage:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Redis is Argo CD's shared cache. Three Redis/Sentinel pods maintain quorum;
# two HAProxy pods expose the current primary to all Argo CD components.
redis-ha:
  enabled: true
  replicas: 3
  existingSecret: argocd-redis
  authKey: auth
  hardAntiAffinity: true
  podDisruptionBudget:
    minAvailable: 2
    unhealthyPodEvictionPolicy: AlwaysAllow
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  persistentVolume:
    # Kubernetes/etcd holds authoritative Argo CD state; Redis is rebuildable.
    enabled: false
  redis:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  sentinel:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  splitBrainDetection:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  init:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  haproxy:
    replicas: 2
    hardAntiAffinity: true
    podDisruptionBudget:
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 128Mi
    init:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

redisSecretInit:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
