# Application health is not built in; without it, parent sync waves do not wait
# for child controllers or the Auto Mode configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
    argocd.argoproj.io/sync-options: ServerSideApply=true,DisableClientSideApplyMigration=true
data:
  resource.customizations.health.argoproj.io_Application: |
    local dependencies = {
      ["auto-mode"] = true,
      ["istio-base"] = true, ["istiod"] = true, ["argo-rollouts"] = true,
      ["storage"] = true
    }
    if not dependencies[obj.metadata.name] then
      return { status = "Healthy", message = "No platform dependency gate" }
    end
    local hs = { status = "Progressing", message = "Waiting for platform application sync and health" }
    if obj.status ~= nil and obj.status.sync ~= nil and obj.status.sync.status == "Synced" then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
    end
    return hs
