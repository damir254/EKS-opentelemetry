apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
  annotations:
    # The parent health gate waits for gp3 before monitoring at wave 4 and Loki at 5.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/damir254/EKS-opentelemetry.git
    targetRevision: main
    path: platform/storage
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
