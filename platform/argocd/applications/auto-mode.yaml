apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auto-mode
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/damir254/EKS-opentelemetry.git
    targetRevision: main
    path: platform/auto-mode
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
