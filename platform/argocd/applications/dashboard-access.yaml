apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/damir254/EKS-opentelemetry.git
    targetRevision: main
    path: platform/dashboard-access
    helm:
      releaseName: dashboard-access
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
