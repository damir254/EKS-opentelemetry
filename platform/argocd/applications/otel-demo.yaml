apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/damir254/EKS-opentelemetry.git
    targetRevision: main
    path: helm/otel-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      name: payment
      namespace: default
      jsonPointers:
        - /spec/replicas
    - group: networking.istio.io
      kind: VirtualService
      name: payment
      namespace: default
      jqPathExpressions:
        - '.spec.http[] | select(.name == "primary") | .route[].weight'
    - group: networking.istio.io
      kind: DestinationRule
      name: payment
      namespace: default
      jqPathExpressions:
        - '.spec.subsets[] | select(.name == "stable" or .name == "canary") | .labels["rollouts-pod-template-hash"]'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Child Applications reconcile independently while controllers and CRDs start.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
      - ApplyOutOfSyncOnly=true
      # Keep the old Deployment until its replacement Rollout is healthy.
      - PruneLast=true
