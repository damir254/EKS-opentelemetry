# Classic sidecars only: no gateway, ambient components, or Istio CNI.
autoscaleEnabled: false
replicaCount: 2
pdb:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app: istiod
            istio.io/rev: default
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
cni:
  enabled: false
env:
  ENABLE_NATIVE_SIDECARS: "false"
sidecarInjectorWebhook:
  enableNamespacesByDefault: false
meshConfig:
  enablePrometheusMerge: false
  defaultConfig:
    holdApplicationUntilProxyStarts: true
    concurrency: 1
global:
  defaultPodDisruptionBudget:
    enabled: true
  proxy:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
